help_stale = "Stale or disconnected: reconnect or refresh before acting. A retained observation is labelled stale until the coordinator supplies a new one."
help_blocked = "Blocked campaign: read its explanation on Campaign and clear only the stated cause. A block is not a completed task."
help_keyboard_title = "Keyboard"
help_keyboard_navigation = "Ctrl+1 through Ctrl+8 select a destination. Tab and Shift+Tab move focus; Enter or Space activates the focused control."
