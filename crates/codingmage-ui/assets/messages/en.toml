help_get_started = "Get started"
help_open_configuration = "Open an existing configuration in Setup, or create one for a disposable repository. Opening it observes readiness and starts no agent."
help_select_campaign = "Select a campaign on the Campaign screen, review preflight, and explicitly admit and start it. Closing this window leaves coordinator work under coordinator control."
help_attention = "If something needs attention"
help_missing_coordinator = "Coordinator missing: install the matching codingmage executable beside this app, then reopen the app."
