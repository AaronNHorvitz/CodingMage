schema_version = 1

[messages]
help_title = "Help and About"
help_offline = "This help is available without a repository, coordinator connection or network access."
help_return = "Return to Overview"
help_setup = "Open Setup"
help_get_started = "Get started"
help_open_configuration = "Open an existing configuration in Setup, or create one for a disposable repository. Opening it observes readiness and starts no agent."
help_select_campaign = "Select a campaign on the Campaign screen, review preflight, and explicitly admit and start it. Closing this window leaves coordinator work under coordinator control."
help_attention = "If something needs attention"
help_missing_coordinator = "Coordinator missing: install the matching codingmage executable beside this app, then reopen the app."
help_provider = "Provider unavailable or sign-in required: check the provider in Setup and rerun preflight. No other provider is selected silently."
help_stale = "Stale or disconnected: reconnect or refresh before acting. A retained observation is labelled stale until the coordinator supplies a new one."
help_blocked = "Blocked campaign: read its explanation on Campaign and clear only the stated cause. A block is not a completed task."
help_keyboard_title = "Keyboard"
help_keyboard_navigation = "Ctrl+1 through Ctrl+8 select a destination. Tab and Shift+Tab move focus; Enter or Space activates the focused control."
help_keyboard_commands = "F5 requests a new diagnosis and campaign observation. A Show command section reveals the exact supported coordinator command without running it."
help_diagnostics_title = "Copyable diagnostic summary"
help_diagnostics_description = "This summary contains only the interface version, platform and sibling coordinator availability. It omits paths, repository content, prompts and credentials."
help_diagnostics_copy = "Copy diagnostic summary"
help_glossary_title = "Glossary"
help_term_campaign = "Campaign"
help_meaning_campaign = "A coordinator-owned run against one exact repository and campaign specification."
help_term_admission = "Admission"
help_meaning_admission = "A record that the owner reviewed one bound preflight result. It grants no extra permission."
help_term_preflight = "Preflight"
help_meaning_preflight = "Checks that the selected campaign meets the coordinator's current prerequisites before starting."
help_term_source_checkbox = "Source checkbox"
help_meaning_source_checkbox = "A mark in the task source document. It is separate from verified completion and accepted outcomes."
help_term_gate = "Gate"
help_meaning_gate = "A registered verification command and its recorded result. An unreported gate remains unknown."
help_term_stale = "Stale"
help_meaning_stale = "A previous observation retained after a failed or overdue refresh. Confirm it before acting."
help_term_blocker = "Blocker"
help_meaning_blocker = "A recorded reason work cannot advance until its stated cause is resolved."
help_term_support_bundle = "Support bundle"
help_meaning_support_bundle = "A manually requested redacted directory of selected coordinator records; sharing it is a separate owner action."
help_about_title = "About"
help_about_source_notice = "CodingMage source is licensed under Apache-2.0. The exact packaged third-party licence set is generated from the locked dependency graph for a release candidate; this source view is not a package qualification."
help_about_source_license = "CodingMage source licence (Apache-2.0)"
help_about_third_party = "Third-party source notices"
