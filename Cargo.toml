[workspace]
members = [
    "crates/codingmage-cli",
    "crates/codingmage-claude",
    "crates/codingmage-codex",
    "crates/codingmage-agent",
    "crates/codingmage-contracts",
    "crates/codingmage-core",
    "crates/codingmage-git",
    "crates/codingmage-github",
    "crates/codingmage-gate",
    "crates/codingmage-plan",
    "crates/codingmage-orchestrator",
    "crates/codingmage-platform",
    "crates/codingmage-monitor",
    "crates/codingmage-process",
    "crates/codingmage-project",
    "crates/codingmage-routing",
    "crates/codingmage-runtime",
    "crates/codingmage-review",
    "crates/codingmage-state",
    "crates/codingmage-service",
    "crates/codingmage-soak",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AaronNHorvitz/CodingMage"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
codingmage-agent = { path = "crates/codingmage-agent", version = "=0.1.0" }
codingmage-claude = { path = "crates/codingmage-claude", version = "=0.1.0" }
codingmage-codex = { path = "crates/codingmage-codex", version = "=0.1.0" }
codingmage-contracts = { path = "crates/codingmage-contracts", version = "=0.1.0" }
codingmage-core = { path = "crates/codingmage-core", version = "=0.1.0" }
codingmage-git = { path = "crates/codingmage-git", version = "=0.1.0" }
codingmage-github = { path = "crates/codingmage-github", version = "=0.1.0" }
codingmage-gate = { path = "crates/codingmage-gate", version = "=0.1.0" }
codingmage-plan = { path = "crates/codingmage-plan", version = "=0.1.0" }
codingmage-orchestrator = { path = "crates/codingmage-orchestrator", version = "=0.1.0" }
codingmage-platform = { path = "crates/codingmage-platform", version = "=0.1.0" }
codingmage-monitor = { path = "crates/codingmage-monitor", version = "=0.1.0" }
codingmage-process = { path = "crates/codingmage-process", version = "=0.1.0" }
codingmage-project = { path = "crates/codingmage-project", version = "=0.1.0" }
codingmage-routing = { path = "crates/codingmage-routing", version = "=0.1.0" }
codingmage-runtime = { path = "crates/codingmage-runtime", version = "=0.1.0" }
codingmage-review = { path = "crates/codingmage-review", version = "=0.1.0" }
codingmage-state = { path = "crates/codingmage-state", version = "=0.1.0" }
codingmage-service = { path = "crates/codingmage-service", version = "=0.1.0" }
codingmage-soak = { path = "crates/codingmage-soak", version = "=0.1.0" }
nix = { version = "=0.31.3", default-features = false, features = ["process", "resource", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.4"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
