[workspace]
members = [
    "crates/codingmage-cli",
    "crates/codingmage-contracts",
    "crates/codingmage-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AaronNHorvitz/CodingMage"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
codingmage-contracts = { path = "crates/codingmage-contracts", version = "=0.1.0" }
codingmage-core = { path = "crates/codingmage-core", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = "=1.1.4"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
